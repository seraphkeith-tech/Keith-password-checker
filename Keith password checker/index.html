<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Password Checker</title>
    <!-- Link to our CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Password Checker</h2>
       
        <!-- The password input field -->
        <input type="password" id="passwordBox" placeholder="Type a password...">
       
        <!-- This is where we will show the strength message -->
        <p>Strength: <span id="strengthText">None</span></p>
    </div>

    <!-- Link to our JavaScript file at the bottom -->
    <script src="script.js"></script>
</body>
</html>
